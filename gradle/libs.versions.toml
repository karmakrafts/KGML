[versions]

javaCompile = "25"
javaTarget = "17"

androidGradle = "9.4.1" # https://developer.android.com/reference/tools/gradle-api

kgml = "1.6.0"
kotlin = "2.5.0-Beta2" # https://github.com/JetBrains/kotlin/releases
kotlinBrowser = "2026.10.5" # https://github.com/JetBrains/kotlin-wrappers/releases
kotlinxSerialization = "1.12.0" # https://github.com/Kotlin/kotlinx.serialization/releases
dokka = "2.3.0-Beta" # https://github.com/Kotlin/dokka/releases
karmaConventions = "1.23.0.315-SNAPSHOT" # https://github.com/karmakrafts/karma-conventions/tags

# kgml-io

kotlinxIo = "0.9.1" # https://github.com/Kotlin/kotlinx-io/releases
karbide = "1.14.0.122-SNAPSHOT" # https://github.com/karmakrafts/Karbide/releases

# kgml-benchmarks

kotlinxBenchmark = "0.5.0" # https://github.com/Kotlin/kotlinx-benchmark/releases
jmh = "1.37" # https://github.com/openjdk/jmh/tags
joml = "1.10.9" # https://github.com/JOML-CI/JOML/releases

[libraries]

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-wrappers-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlinBrowser" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# kgml-io

kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinx-io-bytestring = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring", version.ref = "kotlinxIo" }
karbide-core = { module = "dev.karmakrafts.karbide:karbide-core", version.ref = "karbide" }

# kgml-benchmarks

kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
joml = { module = "org.joml:joml", version.ref = "joml" }

[plugins]

android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradle" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
karmaConventions = { id = "dev.karmakrafts.conventions.karma-conventions", version.ref = "karmaConventions" }

# kgml-benchmarks

kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }